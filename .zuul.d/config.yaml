---
- project:
    name: SovereignCloudStack/standards
    default-branch: main
    merge-mode: "squash-merge"
    periodic-daily:
      jobs:
        - scs-check-iaas
        - scs-check-kaas
- job:
    name: scs-check-iaas
    parent: base
    secrets:
     - name: clouds_conf
       secret: SECRET_STANDARDS
    nodeset: pod-fedora-40
    vars:
      iaas: true
    pre-run:
     - playbooks/pre_cloud.yaml
    run: playbooks/compliance_check.yaml
- job:
    name: scs-check-kaas
    parent: base
    secrets:
     - name: clouds_conf
       secret: SECRET_STANDARDS
    nodeset: pod-fedora-40
    vars:
      kaas: true
      sonobuoy_tar_gz_url: >
        https://github.com/vmware-tanzu/sonobuoy/releases/download/v0.57.3/sonobuoy_0.57.3_linux_amd64.tar.gz
    pre-run:
     - playbooks/pre_cloud.yaml
    run: playbooks/compliance_check.yaml
