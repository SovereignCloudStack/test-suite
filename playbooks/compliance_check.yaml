---
- name: Run compliance check tool
  hosts: all
  tasks:
    - name: Run run_iaas.py
      ansible.builtin.shell:
        cmd: playbooks/run_iaas.sh
        chdir: "{{ ansible_user_dir }}/{{ zuul.project.src_dir }}"
      changed_when: true
      when: iaas | bool

    - name: Run run_kaas.py
      ansible.builtin.shell:
        cmd: playbooks/run_kaas.sh
        chdir: "{{ ansible_user_dir }}/{{ zuul.project.src_dir }}"
      changed_when: true
      when: kaas | bool
